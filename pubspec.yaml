name: fasting_workspace

environment:
  sdk: ^3.11.0

workspace:
  - app
  - packages/**

dev_dependencies:
  melos: ^7.3.0

melos:
  name: Fasting Tracker
  sdkPath: .fvm/flutter_sdk

  scripts:
    # Code formatting
    format:
      description: Check Dart code formatting
      run: dart format --set-exit-if-changed .
      exec:
        concurrency: 1

    format:fix:
      description: Fix Dart code formatting
      run: dart format .
      exec:
        concurrency: 1

    # Code generation
    build_runner:
      description: Run build_runner to generate code
      run: dart run melos exec --concurrency=1 --depends-on=build_runner -- "dart run build_runner build --delete-conflicting-outputs"

    # Linting scripts
    lint:
      description: Run dart analyze for all packages
      run: dart analyze --no-fatal-warnings .
      exec:
        concurrency: 1

    lint:fix:
      description: Apply lint fixes for all packages
      run: dart fix --apply
      exec:
        concurrency: 1

    # Testing scripts
    test:
      description: Run tests for all packages
      run: dart test
      packageFilters:
        dirExists: test
      exec:
        concurrency: 1
        failFast: true

    test:coverage:
      description: Run tests with coverage for all packages
      run: dart test --coverage=coverage && dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
      packageFilters:
        dirExists: test
      exec:
        concurrency: 1
